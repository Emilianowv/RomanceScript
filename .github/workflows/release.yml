name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git make python3 libxkbcommon-tools xkb-data x11-xkb-utils dpkg-dev
      - uses: actions/checkout@v4
      - name: Check tag and select the two release downloads
        id: downloads
        shell: bash
        run: |
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          printf 'linux=dist/romancescript_%s_all.deb\nwindows=dist/RomanceScript-%s-Windows.zip\n' "$version" "$version" >> "$GITHUB_OUTPUT"
      - run: make build
      - run: python3 scripts/test_deb.py --live
      - name: Publish release with Linux and Windows files
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.downloads.outputs.linux }}
            ${{ steps.downloads.outputs.windows }}
          body_path: docs/RELEASE.md
